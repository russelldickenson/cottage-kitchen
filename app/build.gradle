plugins {
    id 'com.android.application'
}

// Platform SDK only: no AndroidX, no third-party dependencies.
android {
    namespace 'com.zigzag.cottagekitchen'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zigzag.cottagekitchen'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    // Release signing comes from the environment (set by build.sh), so no secrets live in this file.
    // Without COTTAGEKITCHEN_KEYSTORE the release build is simply left unsigned.
    def keystorePath = System.getenv('COTTAGEKITCHEN_KEYSTORE')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('COTTAGEKITCHEN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('COTTAGEKITCHEN_KEY_ALIAS')
                keyPassword System.getenv('COTTAGEKITCHEN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
