org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
android.nonTransitiveRClass=true

# Non-secret, but required: the alias for this app's key inside the shared keystore.
# An ANDROID_KEY_ALIAS environment value overrides this when set.
signing.defaultKeyAlias=cottagekitchen

# Per-app APK filename, used by both app/build.gradle and build.sh.
apk.outputFileName=cottage_kitchen.apk
