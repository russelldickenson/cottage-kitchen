  <title id="howTitle">How to play Cottage Kitchen</title>
  <desc id="howDesc">A seven by eight board of smiling ingredient tiles with three berries matched in a row, beside four steps: swap two neighbours, match three or more, beat the move budget, and earn up to three stars.</desc>

  <defs>
