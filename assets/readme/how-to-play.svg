      <circle r="14" stroke="#5A3410" stroke-width="2.5"/>
      <ellipse cx="-5" cy="-7" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="-5" cy="-2" r="2" fill="#5A3410"/>
      <circle cx="5" cy="-2" r="2" fill="#5A3410"/>
      <path d="M-4 3 Q0 8 4 3" fill="none" stroke="#5A3410" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#FFF4D2"/>

  <g id="heading" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="86" font-size="46" font-weight="900" fill="#5A3410">How to play</text>
    <text x="60" y="122" font-size="23" font-weight="600" fill="#8B5A2B">One recipe at a time — from the first strawberry to the last crumb.</text>
  </g>

