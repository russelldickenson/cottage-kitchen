  <text x="275" y="522" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#8B5A2B">7 × 8 board · 15 ingredients · no timer</text>

  <g id="steps" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <circle cx="572" cy="190" r="22" fill="#75C260" stroke="#5A3410" stroke-width="3"/>
      <text x="572" y="198" text-anchor="middle" font-size="24" font-weight="900" fill="#5A3410">1</text>
      <text x="612" y="184" font-size="30" font-weight="800" fill="#5A3410">Swap two neighbours</text>
      <text x="612" y="215" font-size="21" font-weight="600" fill="#6B3F17">Tap or drag a tile onto the one beside it.</text>
    </g>
    <g>
      <circle cx="572" cy="284" r="22" fill="#FF9B26" stroke="#5A3410" stroke-width="3"/>
      <text x="572" y="292" text-anchor="middle" font-size="24" font-weight="900" fill="#5A3410">2</text>
      <text x="612" y="278" font-size="30" font-weight="800" fill="#5A3410">Match three or more</text>
      <text x="612" y="309" font-size="21" font-weight="600" fill="#6B3F17">Line up ingredients to harvest them into the order.</text>
    </g>
    <g>
      <circle cx="572" cy="378" r="22" fill="#3FA9F5" stroke="#5A3410" stroke-width="3"/>
      <text x="572" y="386" text-anchor="middle" font-size="24" font-weight="900" fill="#5A3410">3</text>
      <text x="612" y="372" font-size="30" font-weight="800" fill="#5A3410">Beat the move budget</text>
      <text x="612" y="403" font-size="21" font-weight="600" fill="#6B3F17">Finish the order before your moves run out.</text>
    </g>
    <g>
      <circle cx="572" cy="472" r="22" fill="#FFC928" stroke="#5A3410" stroke-width="3"/>
      <text x="572" y="480" text-anchor="middle" font-size="24" font-weight="900" fill="#5A3410">4</text>
      <text x="612" y="466" font-size="30" font-weight="800" fill="#5A3410">Earn up to three stars</text>
      <text x="612" y="497" font-size="21" font-weight="600" fill="#6B3F17">Unlock the next dish and chase a new best score.</text>
