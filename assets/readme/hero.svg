      <g transform="translate(1097 148)"><use xlink:href="#tile" href="#tile" fill="#FFF8E8"/></g>

      <g transform="translate(747 196)"><use xlink:href="#tile" href="#tile" fill="#3FA9F5"/></g>
      <g transform="translate(817 196)"><use xlink:href="#tile" href="#tile" fill="#FF9B26"/></g>
      <g transform="translate(887 196)"><use xlink:href="#tile" href="#tile" fill="#FFC928"/></g>
      <g transform="translate(957 196)"><use xlink:href="#tile" href="#tile" fill="#75C260"/></g>
      <g transform="translate(1027 196)"><use xlink:href="#tile" href="#tile" fill="#E53B4F"/></g>
      <g transform="translate(1097 196)"><use xlink:href="#tile" href="#tile" fill="#FFC928"/></g>

      <g transform="translate(747 244)"><use xlink:href="#tile" href="#tile" fill="#E53B4F"/></g>
      <g transform="translate(817 244)"><use xlink:href="#tile" href="#tile" fill="#E53B4F"/></g>
      <g transform="translate(887 244)"><use xlink:href="#tile" href="#tile" fill="#E53B4F"/></g>
      <g transform="translate(957 244)"><use xlink:href="#tile" href="#tile" fill="#3FA9F5"/></g>
      <g transform="translate(1027 244)"><use xlink:href="#tile" href="#tile" fill="#FFF8E8"/></g>
      <g transform="translate(1097 244)"><use xlink:href="#tile" href="#tile" fill="#75C260"/></g>

      <g transform="translate(747 292)"><use xlink:href="#tile" href="#tile" fill="#75C260"/></g>
      <g transform="translate(817 292)"><use xlink:href="#tile" href="#tile" fill="#FFF8E8"/></g>
      <g transform="translate(887 292)"><use xlink:href="#tile" href="#tile" fill="#FF9B26"/></g>
      <g transform="translate(957 292)"><use xlink:href="#tile" href="#tile" fill="#FFC928"/></g>
      <g transform="translate(1027 292)"><use xlink:href="#tile" href="#tile" fill="#3FA9F5"/></g>
      <g transform="translate(1097 292)"><use xlink:href="#tile" href="#tile" fill="#E53B4F"/></g>
    </g>
    <rect x="724" y="220" width="217" height="48" rx="18" fill="none" stroke="#FFC928" stroke-width="4" stroke-dasharray="10 7"/>
  </g>
  <text x="925" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#8B5A2B">Match three, fill the order, cook the dish.</text>
</svg>
