<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Cottage Kitchen — a cozy cooking match-3 game</title>
  <desc id="heroDesc">Cottage Kitchen title on a cream kitchen background with colourful bunting. Beside it, a match-3 board of smiling ingredient tiles shows three red berries lined up to be harvested.</desc>

  <defs>
    <g id="tile">
      <circle r="19" stroke="#5A3410" stroke-width="3"/>
      <ellipse cx="-7" cy="-9" rx="6" ry="3" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="-6" cy="-3" r="2.7" fill="#5A3410"/>
      <circle cx="6" cy="-3" r="2.7" fill="#5A3410"/>
      <path d="M-5 4 Q0 10 5 4" fill="none" stroke="#5A3410" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="380" rx="28" fill="#FFF4D2"/>

  <!-- bunting, the recurring motif from the game's kitchen wallpaper -->
  <g id="bunting">
    <path d="M40 34 L600 70 L1160 34" fill="none" stroke="#5A3410" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#5A3410" stroke-width="2" stroke-linejoin="round">
      <polygon points="66,38 94,38 80,68" fill="#E53B4F"/>
      <polygon points="138,41 166,41 152,71" fill="#FF9B26"/>
      <polygon points="210,45 238,45 224,75" fill="#FFC928"/>
      <polygon points="282,49 310,49 296,79" fill="#75C260"/>
      <polygon points="354,53 382,53 368,83" fill="#3FA9F5"/>
      <polygon points="426,57 454,57 440,87" fill="#9B6BC9"/>
      <polygon points="498,61 526,61 512,91" fill="#E53B4F"/>
      <polygon points="570,66 598,66 584,96" fill="#FF9B26"/>
      <polygon points="602,66 630,66 616,96" fill="#FFC928"/>
      <polygon points="674,62 702,62 688,92" fill="#75C260"/>
      <polygon points="746,58 774,58 760,88" fill="#3FA9F5"/>
      <polygon points="818,53 846,53 832,83" fill="#9B6BC9"/>
      <polygon points="890,49 918,49 904,79" fill="#E53B4F"/>
      <polygon points="962,45 990,45 976,75" fill="#FF9B26"/>
      <polygon points="1034,41 1062,41 1048,71" fill="#FFC928"/>
      <polygon points="1106,38 1134,38 1120,68" fill="#75C260"/>
    </g>
  </g>

  <!-- title -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="124" font-size="21" font-weight="700" letter-spacing="3" fill="#8B5A2B">ANDROID  ·  MATCH-3  ·  COZY COOKING</text>
    <text x="60" y="202" font-size="82" font-weight="900" letter-spacing="-2" fill="#5A3410">COTTAGE</text>
    <text x="60" y="274" font-size="82" font-weight="900" letter-spacing="-2" fill="#5A3410">KITCHEN</text>
    <path d="M64 290 L404 290" fill="none" stroke="#75C260" stroke-width="8" stroke-linecap="round"/>
    <text x="64" y="326" font-size="29" font-weight="700" fill="#6B3F17">Match, harvest, and cook 14 little dishes.</text>
    <text x="64" y="356" font-size="21" font-weight="600" fill="#8B5A2B">49 levels  ·  15 ingredients  ·  no network needed</text>
  </g>

  <!-- a small, honest specimen of the match-3 board -->
  <g id="board-proof">
    <rect x="700" y="112" width="450" height="228" rx="22" fill="#6B3F17" stroke="#5A3410" stroke-width="4"/>
    <rect x="712" y="124" width="426" height="204" rx="14" fill="#FFFAEC"/>
    <g id="tiles">
      <g transform="translate(747 148)"><use xlink:href="#tile" href="#tile" fill="#FFC928"/></g>
      <g transform="translate(817 148)"><use xlink:href="#tile" href="#tile" fill="#75C260"/></g>
      <g transform="translate(887 148)"><use xlink:href="#tile" href="#tile" fill="#3FA9F5"/></g>
